<body>
    <!-- Skip link to the main content. -->
    <a href="#main-content">Skip to content</a>

    <!-- Opening title, painter's name and chapter navigation. -->
    <header id="home" class="site-header">
        <!-- Choose the language used for anecdotes and helper explanations. -->
        <div class="language-selector">

            <!-- Show the selected flag and open or close the language list. -->
            <button
                id="language-toggle"
                class="language-toggle"
                type="button"
                aria-label="Choose language. Current language: English."
                aria-expanded="false"
                aria-controls="language-options">

                <img
                    id="selected-language-flag"
                    src="assets/flags/en.svg"
                    width="42"
                    height="28"
                    alt="">

                <img
                    src="assets/icons/language-chevron.svg"
                    width="12"
                    height="8"
                    alt="">
            </button>

            <!-- Keep the language options hidden until the list is opened. -->
            <ul
                id="language-options"
                class="language-options"
                aria-label="Available languages"
                hidden>

                <li>
                    <button type="button" data-language="en"
                            lang="en" aria-pressed="true">
                        <img src="assets/flags/en.svg" width="42" height="28" alt="">
                        <span>English</span>
                    </button>
                </li>

                <li>
                    <button type="button" data-language="zh"
                            lang="zh-Hans" aria-pressed="false">
                        <img src="assets/flags/zh.svg" width="42" height="28" alt="">
                        <span>简体中文</span>
                    </button>
                </li>

                <li>
                    <button type="button" data-language="fr"
                            lang="fr" aria-pressed="false">
                        <img src="assets/flags/fr.svg" width="42" height="28" alt="">
                        <span>Français</span>
                    </button>
                </li>

                <li>
                    <button type="button" data-language="ja"
                            lang="ja" aria-pressed="false">
                        <img src="assets/flags/ja.svg" width="42" height="28" alt="">
                        <span>日本語</span>
                    </button>
                </li>

                <li>
                    <button type="button" data-language="it"
                            lang="it" aria-pressed="false">
                        <img src="assets/flags/it.svg" width="42" height="28" alt="">
                        <span>Italiano</span>
                    </button>
                </li>

                <li>
                    <button type="button" data-language="nl"
                            lang="nl" aria-pressed="false">
                        <img src="assets/flags/nl.svg" width="42" height="28" alt="">
                        <span>Nederlands</span>
                    </button>
                </li>

                <li>
                    <button type="button" data-language="pl"
                            lang="pl" aria-pressed="false">
                        <img src="assets/flags/pl.svg" width="42" height="28" alt="">
                        <span>Polski</span>
                    </button>
                </li>

                <li>
                    <button type="button" data-language="de"
                            lang="de" aria-pressed="false">
                        <img src="assets/flags/de.svg" width="42" height="28" alt="">
                        <span>Deutsch</span>
                    </button>
                </li>
            </ul>
        </div>

        <h1 id="home-title" class="site-title">CARAVAGGIO</h1>

        <!-- Place the painter's name beside the chapter links. -->
        <div class="header-row">
            <p class="painter-name">MICHELANGELO MERISI</p>

            <nav class="chapter-navigation" aria-label="Main navigation">
                <ul>
                    <li><a href="#light" lang="en">LIGHT</a></li>
                    <li><a href="#shadow" lang="en">SHADOW</a></li>
                    <li><a href="#blood" lang="en">BLOOD</a></li>
                </ul>
            </nav>
        </div>
        <!-- Announce a language-loading error without replacing the current content. -->
        <p id="language-status" class="language-status" role="status"></p>
    </header>

    <!-- Main page content. -->
    <main id="main-content">
        <!-- Introductory montage with sound and playback controls. -->
        <div class="opening-video">
            <div class="video-toolbar">
                <!-- Enable the sound control after JavaScript is ready. -->
                <button
                    id="video-audio-button"
                    class="video-toggle"
                    type="button"
                    aria-controls="intro-video"
                    aria-label="Video sound"
                    aria-pressed="false"
                    title="Turn sound on"
                    hidden>

                    <!-- Show the speaker with either sound waves or a mute symbol. -->
                    <svg
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                        focusable="false">

                        <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>

                        <g class="sound-waves">
                            <path d="M15 8a6 6 0 0 1 0 8"></path>
                            <path d="M18 5a10 10 0 0 1 0 14"></path>
                        </g>

                        <path class="sound-muted" d="M16 9l5 6m0-6-5 6"></path>
                    </svg>
                </button>

                <!-- Offer a keyboard-accessible playback control beside the sound button. -->
                <button
                    id="video-playback-button"
                    class="video-toggle"
                    type="button"
                    aria-controls="intro-video"
                    aria-label="Play video"
                    title="Play video"
                    hidden>
                    <span class="playback-icon" aria-hidden="true"></span>
                </button>

                <!-- Announce playback feedback. -->
                <p
                    id="video-audio-status"
                    class="audio-status"
                    role="status"></p>
            </div>

            <!-- Announce the music credit after sound is enabled. -->
            <p id="video-music-status" class="video-music-status" role="status"></p>

            <video
                id="intro-video"
                class="intro-video"
                width="1280"
                height="720"
                loop
                playsinline
                preload="auto"
                aria-label="Introductory video about Caravaggio">
                <source src="assets/videos/cara.mp4" type="video/mp4">
                Your browser does not support video playback.
            </video>
        </div>

        <!-- Navigate from Home to Light below the video frame. -->
        <div class="home-section-navigation">
            <a class="home-next-section section-arrow" href="#light" data-previous-section="home" data-next-section="light" aria-labelledby="light-title">
                <svg viewBox="0 0 180 42" aria-hidden="true" focusable="false">
                    <path d="M60 3H120V18H170L90 39 10 18H60Z"></path>
                </svg>
            </a>
        </div>

        <!-- Chapter sections. -->
        <!-- Light chapter and its horizontally scrollable gallery. -->
        <section
            id="light"
            class="chapter"
            aria-labelledby="light-title">

            <!-- Allow keyboard users to focus and scroll the gallery. -->
            <div
                class="chapter-scroll"
                tabindex="0"
                role="group"
                aria-label="Light gallery">

                <!-- Arrange the title and gallery items along one horizontal track. -->
                <div class="chapter-track">
                    <!-- Complete artwork and identifying caption. -->
                    <figure class="gallery-artwork light-artwork--medusa" id="medusa" data-gallery-label="Medusa">
                        <div class="artwork-image">
                            <img
                                src="assets/artworks/light/medusa.jpg"
                                alt="Medusa’s severed head is shown on a round shield. Her face is twisted in pain, with wide eyes, a furrowed brow and an open mouth. Snakes coil around her face, and blood streams from her neck."
                                decoding="async">
                        </div>
                        <figcaption class="gallery-caption artwork-caption">
                            <span>MEDUSA</span>
                            <span>c. 1597–1598</span>
                            <span>Gallerie degli Uffizi, Florence</span>
                        </figcaption>
                    </figure>

                    <!-- Artwork detail and its short anecdote. -->
                    <figure class="gallery-artwork light-artwork--medusa-eyes" id="medusa-eyes" data-gallery-label="Detail of Medusa’s eyes">
                        <div class="artwork-image">
                            <img
                                src="assets/artworks/light/medusa-detail-source.jpg"
                                alt="Medusa’s eyes are wide open, staring straight at the viewer. Her brows draw together above her nose, forming a deep crease between her eyes in an expression of dismay and terror."
                                decoding="async">
                        </div>
                        <figcaption class="gallery-caption anecdote-caption">
                            <!-- Open the explanation associated with this artwork detail. -->
                            <button
                                id="medusa-helper-button"
                                data-helper="medusa-eyes"
                                class="helper-button"
                                type="button"
                                aria-label="Read more about Medusa’s eyes"
                                aria-haspopup="dialog"
                                aria-controls="artwork-helper"
                                aria-expanded="false">
                                <span aria-hidden="true">✦</span>
                            </button>

                            <span>They criticized his ability to paint movement.<br>
                                The answer.</span>
                        </figcaption>
                    </figure>

                    <!-- Opening title between the two groups of artworks. -->
                    <div class="chapter-title-panel">
                        <h2 id="light-title" class="chapter-title">LIGHT</h2>
                    </div>

                    <!-- Artwork detail and its short anecdote. -->
                    <figure class="gallery-artwork light-artwork--basket-edge" id="basket-edge" data-gallery-label="The basket at the table edge">
                        <div class="artwork-image">
                            <img
                                src="assets/artworks/light/basket-of-fruit.jpg"
                                alt="The wicker basket projects just beyond the edge of the table, casting a thin shadow on it. Bunches of white and black grapes and a few pears fill the basket. Dry leaves hang over its rim."
                                decoding="async">
                        </div>
                        <figcaption class="gallery-caption anecdote-caption">
                            <!-- Open the explanation associated with this artwork detail. -->
                            <button
                                id="basket-edge-helper-button"
                                data-helper="basket-edge"
                                class="helper-button"
                                type="button"
                                aria-label="Read more: Detail of the basket extending over the table edge"
                                aria-haspopup="dialog"
                                aria-controls="artwork-helper"
                                aria-expanded="false">
                                <span aria-hidden="true">✦</span>
                            </button>

                            <span>An invitation to come closer.<br>
                                Until you want to reach out and push the basket back into the painting.</span>
                        </figcaption>
                    </figure>

                    <!-- Artwork detail and its short anecdote. -->
                    <figure class="gallery-artwork light-artwork--fruit-light" id="fruit-light" data-gallery-label="The illuminated fruit">
                        <div class="artwork-image">
                            <img
                                src="assets/artworks/light/basket-of-fruit.jpg"
                                alt="Light glints on the grapes, on the yellow and red skin of an apple, and on the skins of the pears and figs. Realistic details such as bruises and small blemishes are visible on the fruit. A large leaf with prominent veins spreads above it."
                                decoding="async">
                        </div>
                        <figcaption class="gallery-caption anecdote-caption">
                            <!-- Open the explanation associated with this artwork detail. -->
                            <button
                                id="fruit-light-helper-button"
                                data-helper="fruit-light"
                                class="helper-button"
                                type="button"
                                aria-label="Read more: Detail of the illuminated fruit"
                                aria-haspopup="dialog"
                                aria-controls="artwork-helper"
                                aria-expanded="false">
                                <span aria-hidden="true">✦</span>
                            </button>

                            <span>An explosion of light shapes matter.<br>
                                Every detail comes to life.</span>
                        </figcaption>
                    </figure>

                    <!-- Artwork detail and its short anecdote. -->
                    <figure class="gallery-artwork light-artwork--empty-background" id="empty-background" data-gallery-label="The background behind the basket">
                        <div class="artwork-image">
                            <img
                                src="assets/artworks/light/basket-of-fruit.jpg"
                                alt="A pale yellow background fills almost the entire frame. The edges of a few leaves are visible at the lower left. On the right, a slender branch crosses the empty space diagonally."
                                decoding="async">
                        </div>
                        <figcaption class="gallery-caption anecdote-caption">
                            <!-- Open the explanation associated with this artwork detail. -->
                            <button
                                id="empty-background-helper-button"
                                data-helper="empty-background"
                                class="helper-button"
                                type="button"
                                aria-label="Read more: Detail of the pale background behind the fruit"
                                aria-haspopup="dialog"
                                aria-controls="artwork-helper"
                                aria-expanded="false">
                                <span aria-hidden="true">✦</span>
                            </button>

                            <span>Emptiness becomes space.<br>
                                The impossible challenge.</span>
                        </figcaption>
                    </figure>

                    <!-- Complete artwork and identifying caption. -->
                    <figure class="gallery-artwork light-artwork--basket" id="basket" data-gallery-label="Basket of Fruit">
                        <div class="artwork-image">
                            <img
                                src="assets/artworks/light/basket-of-fruit.jpg"
                                alt="A wicker basket brimming with fruit projects just beyond the edge of a wooden surface. Among the bunches of white and black grapes are a red-blushed apple, pears and figs. Some leaves rise above the fruit, while others, dry and curled, hang down at the sides. The basket occupies the lower part of the painting, leaving a broad expanse of pale yellow above."
                                decoding="async">
                        </div>
                        <figcaption class="gallery-caption artwork-caption">
                            <span>BASKET OF FRUIT</span>
                            <span>c. 1597–1600</span>
                            <span>Biblioteca Ambrosiana, Milan</span>
                        </figcaption>
                    </figure>

                    <!-- Artwork detail and its short anecdote. -->
                    <figure class="gallery-artwork light-artwork--emmaus-basket" id="emmaus-basket" data-gallery-label="The basket and its shadow">
                        <div class="artwork-image">
                            <img
                                src="assets/artworks/light/supper-at-emmaus.jpg"
                                alt="A wicker basket filled with fruit projects beyond the edge of the table. Light falls on the grapes and the skins of the fruit. The basket’s shadow stretches to the right across the white tablecloth, tracing the shape of a fish."
                                decoding="async">
                        </div>
                        <figcaption class="gallery-caption anecdote-caption">
                            <!-- Open the explanation associated with this artwork detail. -->
                            <button
                                id="emmaus-basket-helper-button"
                                data-helper="emmaus-basket"
                                class="helper-button"
                                type="button"
                                aria-label="Read more: Detail of the basket and its shadow in The Supper at Emmaus"
                                aria-haspopup="dialog"
                                aria-controls="artwork-helper"
                                aria-expanded="false">
                                <span aria-hidden="true">✦</span>
                            </button>

                            <span>Light reveals the truth.</span>
                        </figcaption>
                    </figure>

                    <!-- Artwork detail and its short anecdote. -->
                    <figure class="gallery-artwork light-artwork--emmaus-christ" id="emmaus-christ" data-gallery-label="Christ’s face">
                        <div class="artwork-image">
                            <img
                                src="assets/artworks/light/supper-at-emmaus.jpg"
                                alt="Christ’s eyes are lowered. Light falls on his forehead, nose and one cheek. A large rounded shadow stands out on the wall behind his head, suggesting a halo and a pair of folded angel wings."
                                decoding="async">
                        </div>
                        <figcaption class="gallery-caption anecdote-caption">
                            <!-- Open the explanation associated with this artwork detail. -->
                            <button
                                id="emmaus-christ-helper-button"
                                data-helper="emmaus-christ"
                                class="helper-button"
                                type="button"
                                aria-label="Read more: Detail of Christ and the shadows behind him"
                                aria-haspopup="dialog"
                                aria-controls="artwork-helper"
                                aria-expanded="false">
                                <span aria-hidden="true">✦</span>
                            </button>

                            <span>Light reveals the divine.</span>
                        </figcaption>
                    </figure>

                    <!-- Complete artwork and identifying caption. -->
                    <figure class="gallery-artwork light-artwork--emmaus" id="emmaus" data-gallery-label="The Supper at Emmaus">
                        <div class="artwork-image">
                            <img
                                src="assets/artworks/light/supper-at-emmaus.jpg"
                                alt="At the centre of the table, Christ lowers his gaze and extends his right hand to bless the bread. The two disciples recognise him. On the left, the disciple with his back to us grips the arms of his chair as if to rise. On the right, the other throws his arms wide. The innkeeper stands watching with his face in shadow. In the foreground, a basket of fruit projects over the edge of the table towards the viewer."
                                decoding="async">
                        </div>
                        <figcaption class="gallery-caption artwork-caption">
                            <span>THE SUPPER AT EMMAUS</span>
                            <span>1601</span>
                            <span>The National Gallery, London</span>
                        </figcaption>
                    </figure>
                </div>
            </div>

            <!-- Navigate between Light and Shadow at their shared boundary. -->
            <div class="section-boundary-navigation">
                <a class="section-arrow" href="#shadow"
                    data-previous-section="light" data-next-section="shadow"
                    aria-labelledby="shadow-title">
                    <svg viewBox="0 0 180 42" aria-hidden="true" focusable="false">
                        <path d="M60 3H120V18H170L90 39 10 18H60Z"></path>
                    </svg>
                </a>
            </div>

        </section>

        <!-- Shadow chapter and its horizontally scrollable gallery. -->
        <section id="shadow" class="chapter" aria-labelledby="shadow-title">
            <!-- Allow keyboard users to focus and scroll the gallery. -->
            <div class="chapter-scroll" tabindex="0" role="group" aria-label="Shadow gallery">
                <!-- Arrange the title and gallery items along one horizontal track. -->
                <div class="chapter-track">
                    <!-- Complete artwork and identifying caption. -->
                    <figure class="gallery-artwork shadow-artwork--ursula" id="ursula" data-gallery-label="The Martyrdom of Saint Ursula">
                        <div class="artwork-image">
                            <img
                                src="assets/artworks/shadow/martyrdom-of-saint-ursula.jpg"
                                alt="On the right, Saint Ursula bows her head towards her chest, where an arrow has struck her. Her hands gather around the wound. On the left, an archer in armour still holds his bow. The light brings out Ursula’s face and the red of her cloak. Behind her, among the witnesses, Caravaggio’s face emerges from the darkness. He portrays himself with his face turned upwards and his mouth slightly open."
                                decoding="async">
                        </div>
                        <figcaption class="gallery-caption artwork-caption">
                            <span>THE MARTYRDOM OF SAINT URSULA</span>
                            <span>1610</span>
                            <span>Gallerie d’Italia — Naples</span>
                        </figcaption>
                    </figure>

                    <!-- Artwork detail and its short anecdote. -->
                    <figure class="gallery-artwork shadow-artwork--ursula-detail" id="ursula-detail" data-gallery-label="The self-portrait behind Saint Ursula">
                        <div class="artwork-image">
                            <img
                                src="assets/artworks/shadow/martyrdom-of-saint-ursula.jpg"
                                alt="Caravaggio portrays himself directly behind the martyr. His face emerges from the darkness, his gaze turned upwards and his mouth slightly open. His expression is so pained that it seems almost as though the arrow piercing Ursula has struck him too."
                                decoding="async">
                        </div>
                        <figcaption class="gallery-caption anecdote-caption">
                            <!-- Open the explanation associated with this artwork detail. -->
                            <button
                                id="ursula-detail-helper-button"
                                data-helper="ursula-detail"
                                class="helper-button"
                                type="button"
                                aria-label="Read more: Detail of The Martyrdom of Saint Ursula"
                                aria-haspopup="dialog"
                                aria-controls="artwork-helper"
                                aria-expanded="false">
                                <span aria-hidden="true">✦</span>
                            </button>

                            <span>The arrow pierces Ursula.<br>
                                Behind her, he does more than witness the martyrdom: he seems to share in it.</span>
                        </figcaption>
                    </figure>

                    <!-- Complete artwork and identifying caption. -->
                    <figure class="gallery-artwork shadow-artwork--taking-of-christ" id="taking-of-christ" data-gallery-label="The Taking of Christ">
                        <div class="artwork-image">
                            <img
                                src="assets/artworks/shadow/taking-of-christ.jpg"
                                alt="Christ bows his head and clasps his hands while Judas embraces him and brings his face close to kiss him. From the right, a guard reaches out towards Christ. Light reflects off the black armour. At the far left, John draws back with one hand raised. On the opposite side, Caravaggio portrays himself among those present, leaning his face forward and holding a lantern above the guards."
                                decoding="async">
                        </div>
                        <figcaption class="gallery-caption artwork-caption">
                            <span>THE TAKING OF CHRIST</span>
                            <span>1602</span>
                            <span>National Gallery of Ireland, Dublin</span>
                        </figcaption>
                    </figure>

                    <!-- Artwork detail and its short anecdote. -->
                    <figure class="gallery-artwork shadow-artwork--arrest-witness" id="arrest-witness" data-gallery-label="The man with the lantern">
                        <div class="artwork-image">
                            <img
                                src="assets/artworks/shadow/taking-of-christ.jpg"
                                alt="On the right, Caravaggio portrays himself in profile, leaning forward to look past the guards. Above them, his hand lifts a lantern over the helmets. His forehead and nose, his raised hand and the reflections on the armour emerge from the darkness."
                                decoding="async">
                        </div>
                        <figcaption class="gallery-caption anecdote-caption">
                            <!-- Open the explanation associated with this artwork detail. -->
                            <button
                                id="arrest-witness-helper-button"
                                data-helper="arrest-witness"
                                class="helper-button"
                                type="button"
                                aria-label="Read more: Detail of The Taking of Christ"
                                aria-haspopup="dialog"
                                aria-controls="artwork-helper"
                                aria-expanded="false">
                                <span aria-hidden="true">✦</span>
                            </button>

                            <span>A curious witness to an arrest.<br>
                                Perhaps this was how he imagined the looks of those who had witnessed his own arrests.</span>
                        </figcaption>
                    </figure>

                    <!-- Opening title between the two groups of artworks. -->
                    <div class="chapter-title-panel">
                        <h2 id="shadow-title" class="chapter-title">SHADOW</h2>
                    </div>

                    <!-- Artwork detail and its short anecdote. -->
                    <figure class="gallery-artwork shadow-artwork--goliath" id="goliath" data-gallery-label="Goliath’s face">
                        <div class="artwork-image">
                            <img
                                src="assets/artworks/shadow/david-and-goliath.jpg"
                                alt="Caravaggio gave his own face to Goliath’s severed, bloodied head. The furrowed brow, half-closed eyes and open mouth with visible teeth give him a pained expression."
                                decoding="async">
                        </div>
                        <figcaption class="gallery-caption anecdote-caption">
                            <!-- Open the explanation associated with this artwork detail. -->
                            <button
                                id="goliath-helper-button"
                                data-helper="goliath"
                                class="helper-button"
                                type="button"
                                aria-label="Read more: Detail of Goliath’s face"
                                aria-haspopup="dialog"
                                aria-controls="artwork-helper"
                                aria-expanded="false">
                                <span aria-hidden="true">✦</span>
                            </button>

                            <span>The bruised face after a night of violence rekindles the anguish of the sentence that still hangs over him.<br>
                                In Goliath, his own soul is reflected.</span>
                        </figcaption>
                    </figure>

                    <!-- Complete artwork and identifying caption. -->
                    <figure class="gallery-artwork shadow-artwork--david" id="david" data-gallery-label="David with the Head of Goliath">
                        <div class="artwork-image">
                            <img
                                src="assets/artworks/shadow/david-and-goliath.jpg"
                                alt="David emerges from the darkness with one shoulder bare. In his right hand he holds a sword that cuts diagonally across the lower part of the painting. In his left he holds Goliath’s severed, bloodied head by the hair. Caravaggio gave Goliath his own face. David lowers his gaze towards the head with a melancholy expression."
                                decoding="async">
                        </div>
                        <figcaption class="gallery-caption artwork-caption">
                            <span>DAVID WITH THE HEAD OF GOLIATH</span>
                            <span>c. 1609–1610</span>
                            <span>Galleria Borghese, Rome</span>
                        </figcaption>
