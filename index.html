<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Caravaggio — Light, Shadow, Blood</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Skip link to the main content. -->
    <a href="#main-content">Skip to content</a>

    <!-- Opening title, painter's name and chapter navigation. -->
    <header class="site-header">
        <h1 class="site-title">CARAVAGGIO</h1>

        <!-- Place the painter's name beside the chapter links. -->
        <div class="header-row">
            <p class="painter-name">MICHELANGELO MERISI</p>

            <nav class="chapter-navigation" aria-label="Main navigation">
                <ul>
                    <li><a href="#light" lang="en">LIGHT</a></li>
                    <li><a href="#shadow" lang="en">SHADOW</a></li>
                    <li><a href="#blood" lang="en">BLOOD</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main page content. -->
    <main id="main-content">
        <!-- Play the introductory montage automatically without sound. -->
        <div class="opening-video">
            <video
                class="intro-video"
                width="1280"
                height="720"
                autoplay
                muted
                loop
                playsinline
                preload="auto"
                aria-label="Introductory video about Caravaggio">
                <source src="assets/videos/cara.mp4" type="video/mp4">
                Your browser does not support video playback.
            </video>
        </div>

        <!-- Chapter sections. -->
        <section id="light" aria-labelledby="light-title">
            <h2 id="light-title" lang="en">LIGHT</h2>
        </section>

        <section id="shadow" aria-labelledby="shadow-title">
            <h2 id="shadow-title" lang="en">SHADOW</h2>
        </section>

        <section id="blood" aria-labelledby="blood-title">
            <h2 id="blood-title" lang="en">BLOOD</h2>
        </section>
    </main>

    <!-- Project and course information. -->
    <footer>
        <p>Alessandro Benevelli — COMP-2002 — OPIT</p>
    </footer>
</body>
</html>
